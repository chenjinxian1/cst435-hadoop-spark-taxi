# Spark runs on the same YARN cluster as Hadoop MapReduce, so both
# frameworks get exactly the same machines and resources.
spark.master                     yarn
spark.submit.deployMode          client
spark.yarn.am.memory             512m
# One executor per worker, using both of its cores (scripts pass --num-executors N).
spark.executor.cores             2
spark.executor.memory            2g
spark.executor.memoryOverhead    512m
spark.dynamicAllocation.enabled  false
# Spark jars are uploaded to HDFS once by scripts/cluster.sh instead of on every submit.
spark.yarn.jars                  hdfs:///spark-jars/*.jar
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs:///spark-logs
spark.ui.showConsoleProgress     false
